<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéShop</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --txt:#e2e8f0; --dim:#94a3b8; --acc:#38bdf8; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); padding-bottom:20px; }
  header { padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--dim); font-size:13px; }
  #cats { padding:16px; max-width:720px; margin:0 auto; }
  h2 { font-size:16px; margin:18px 0 8px; color:var(--acc); }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .item .nombre { font-weight:600; }
  .item .precio { color:var(--dim); font-size:13px; }
  .item button { background:var(--acc); color:#0f172a; border:0; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; }
  #estado { max-width:720px; margin:8px auto; padding:0 16px; color:var(--dim); font-size:13px; }
  #btnCarrito { background:var(--acc); color:#0f172a; border:0; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  #fondo { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(380px,92vw); background:var(--panel); border-left:1px solid var(--line); z-index:10; overflow-y:auto; }
  #toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); background:var(--ok); color:#06240f; font-weight:700; padding:10px 18px; border-radius:10px; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .linea { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:14px; }
  .linea .q { color:var(--dim); }
  .linea button { background:var(--line); color:var(--txt); border:0; border-radius:6px; width:26px; height:26px; font-weight:700; cursor:pointer; }
  .totales { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; font-size:14px; }
  .totales .grande { font-size:17px; font-weight:700; color:var(--ok); margin-top:4px; }
  #nombre { width:100%; margin:10px 0 0; padding:9px; border-radius:8px; border:1px solid var(--line); background:#0f172a; color:var(--txt); font-size:15px; }
  #enviar { width:100%; margin-top:10px; background:var(--ok); color:#06240f; border:0; border-radius:8px; padding:12px; font-size:16px; font-weight:800; cursor:pointer; }
  #enviar:disabled { opacity:.4; cursor:not-allowed; }
  .vaciar { background:none; border:0; color:var(--dim); text-decoration:underline; cursor:pointer; font-size:12px; }
  .oculto { display:none; }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto">
    <div style="flex:1">
      <h1>🏪 PokéShop</h1>
      <p id="subtitulo">Cargando catálogo…</p>
    </div>
    <button id="btnCarrito" class="oculto" onclick="abrirDrawer()">🛒 <span id="carritoResumen">0</span></button>
  </div>
</header>
<div id="estado"></div>
<div id="cats"></div>

<div id="fondo" class="oculto" onclick="cerrarDrawer()"></div>
<div id="drawer" class="oculto">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)">
    <b>🛒 Tu pedido</b>
    <button class="vaciar" onclick="vaciar()">(vaciar)</button>
  </div>
  <div id="lineas" style="padding:8px 16px 0"></div>
  <div class="totales" style="padding:0 16px">
    <div id="desglose"></div>
    <div class="grande" id="total"></div>
  </div>
  <div style="padding:12px 16px 20px">
    <input id="nombre" type="text" placeholder="Tu nombre o @usuario de Telegram" autocomplete="off">
    <button id="enviar" onclick="enviar()" disabled>Enviar pedido 📤</button>
    <p style="color:var(--dim);font-size:12px;margin:6px 0 0">Los precios son <b>orientativos</b>. Te confirmo el precio final.</p>
  </div>
</div>

<div id="toast" class="oculto"></div>

<script>
/* ============================================================
 * CONFIGURACIÓN — cambia solo esto
 * ============================================================ */
const CONFIG = {
  sheetId:      '1HYXcafvhTcmRsioH_v0hblwbpu_pGGE1ea9Oqid67vw', // el texto largo de la URL de la hoja
  apiKey:       'AIzaSyDR3zZ2O38q1EaLgwFCyhpXZ6yCtaekcPI',                // clave de Google Cloud con Google Sheets API
  formId:       '1FAIpQLSfGKz3OnfOGn9SF2VewMEQ6VGNu0TxT5XjUhIbgnNe3K0q7XA',      // solo el ID, sin https://docs.google.com/...
  envioVisible: false,  // true = abrir el formulario rellenado (plan de emergencia si el envío oculto falla)
  entryNombre:  1130581316,   // ID del campo "nombre" (del enlace pre-rellenado)
  entryPedido:  768340345,   // ID del campo "pedido"
  entryTotal:   2082756470,   // ID del campo "total"
};

const FORM_URL = 'https://docs.google.com/forms/d/e/' + CONFIG.formId + '/viewform';
const FORM_RESPONSE_URL = 'https://docs.google.com/forms/d/e/' + CONFIG.formId + '/formResponse';

/* Reglas por defecto (se sobreescriben con la pestaña Publico) */
let REGLA = { tasa: 101.47, comisionPct: 0.02, paso: 50, moneda: 'EUR' };

/* ============================================================ */
let catalogo = [];
const carrito = {}; // nombre -> {cat, base, qty}

const fmtEUR = (x) => new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(x) + ' €';
const fmtINR = (x) => new Intl.NumberFormat('es-ES').format(Math.round(x)) + ' ₹';
const enc = encodeURIComponent;

/* Fechas de Google Sheets → milisegundos.
   Acepta: número de serie (fecha real de Sheets) o texto "dd/mm/aaaa [hh:mm]".
   Si solo hay fecha, se entiende fin de ese día (23:59). */
const serialAMs = (s) => Math.round((s - 25569) * 86400000);

function parseFin(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') {
    const ms = serialAMs(v);
    return (v === Math.floor(v)) ? ms + 86400000 - 60000 : ms; // solo fecha → fin de día
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?$/);
  if (m) {
    let y = parseInt(m[3], 10);
    if (y < 100) y += 2000;
    const d = new Date(y, parseInt(m[2], 10) - 1, parseInt(m[1], 10),
                      m[4] ? parseInt(m[4], 10) : 23, m[5] ? parseInt(m[5], 10) : 59);
    return isNaN(d.getTime()) ? null : d.getTime();
  }
  const d2 = new Date(s);
  return isNaN(d2.getTime()) ? null : d2.getTime();
}

const fmtFin = (ms) => {
  const d = new Date(ms);
  if (isNaN(d.getTime())) return '';
  return 'hasta el ' + new Intl.DateTimeFormat('es-ES', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }).format(d);
};

async function fetchRango(rango) {
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.sheetId +
    '/values/' + encodeURIComponent(rango) + '?key=' + CONFIG.apiKey;
  // OJO: no añadir parámetros extra a la URL (Google los rechaza con 400).
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || j.error.status);
  return j.values || [];
}

async function cargar() {
  try {
    // Ajustes públicos
    try {
      const filas = await fetchRango('Publico!A1:B10');
      const mapa = {};
      filas.forEach(f => { if (f.length >= 2) mapa[String(f[0]).trim()] = String(f[1]).trim(); });
      const num = (k, def) => { const v = parseFloat(String(mapa[k] || '').replace(',', '.')); return isNaN(v) ? def : v; };
      REGLA.tasa = num('tasa_inr_por_eur', REGLA.tasa);
      REGLA.comisionPct = num('comision_pct', REGLA.comisionPct);
      REGLA.paso = num('paso_redondeo', REGLA.paso);
      REGLA.moneda = mapa.moneda_venta || REGLA.moneda;
    } catch (e) { console.warn('Pestaña Publico no disponible', e); }

    // Catálogo (columnas: Nombre, Categoria, Precio base (INR), Visible, Notas, Fin)
    const filas = await fetchRango('Articulos!A2:F500');
    catalogo = [];
    filas.forEach(f => {
      if (!f || f.length < 4) return;
      const nombre = String(f[0]).trim();
      const categoria = String(f[1]).trim() || 'Otros';
      const base = parseFloat(String(f[2]).replace(',', '.'));
      const visible = String(f[3]).trim().toUpperCase();
      const fin = parseFin(f[5]);
      if (!nombre || isNaN(base) || base <= 0 || visible !== 'SI') return;
      if (fin && fin < Date.now()) return; // vencido: no se muestra
      catalogo.push({ nombre, categoria, base, fin });
    });
    pintar();
    document.getElementById('subtitulo').textContent = 'Precios orientativos en ' + REGLA.moneda;
  } catch (e) {
    document.getElementById('estado').textContent =
      '⚠️ No se pudo cargar el catálogo (' + e.message + '). Revisa: hoja compartida "cualquiera con el enlace", API key habilitada para Google Sheets API y restringida a este dominio.';
    document.getElementById('subtitulo').textContent = 'Catálogo no disponible';
  }
}

function precioUnitario(base) {
  const con = base * (1 + REGLA.comisionPct);
  const total = Math.ceil(con / REGLA.paso) * REGLA.paso;
  return total / REGLA.tasa;
}

function pintar() {
  const cats = [];
  catalogo.forEach(a => { if (!cats.includes(a.categoria)) cats.push(a.categoria); });
  const cont = document.getElementById('cats');
  cont.innerHTML = '';
  cats.forEach(cat => {
    const h = document.createElement('h2');
    h.textContent = cat;
    cont.appendChild(h);
    catalogo.filter(a => a.categoria === cat).forEach(a => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = '<div><div class="nombre"></div><div class="precio"></div></div><button>Añadir +</button>';
      div.querySelector('.nombre').textContent = a.nombre;
      let precioTexto = fmtINR(a.base) + ' · ≈ ' + fmtEUR(precioUnitario(a.base)) + '/ud';
      if (a.fin) precioTexto += ' · ⏳ ' + fmtFin(a.fin);
      div.querySelector('.precio').textContent = precioTexto;
      div.querySelector('button').onclick = () => add(a);
      cont.appendChild(div);
    });
  });
  pintarCarrito();
}

function add(a) {
  if (!carrito[a.nombre]) carrito[a.nombre] = { cat: a.categoria, base: a.base, qty: 0 };
  carrito[a.nombre].qty++;
  pintarCarrito();
  abrirDrawer();
}

function cambiar(nombre, delta) {
  if (!carrito[nombre]) return;
  carrito[nombre].qty += delta;
  if (carrito[nombre].qty <= 0) delete carrito[nombre];
  pintarCarrito();
}

function vaciar() {
  for (const k in carrito) delete carrito[k];
  pintarCarrito();
}

function abrirDrawer() {
  document.getElementById('fondo').classList.remove('oculto');
  document.getElementById('drawer').classList.remove('oculto');
}

function cerrarDrawer() {
  document.getElementById('fondo').classList.add('oculto');
  document.getElementById('drawer').classList.add('oculto');
}

function mostrarToast(txt) {
  const t = document.getElementById('toast');
  t.textContent = txt;
  t.classList.remove('oculto');
  setTimeout(function () { t.classList.add('oculto'); }, 4500);
}

function calcular() {
  let subtotal = 0;
  for (const k in carrito) subtotal += carrito[k].base * carrito[k].qty;
  const con = subtotal * (1 + REGLA.comisionPct);
  const total = Math.ceil(con / REGLA.paso) * REGLA.paso;
  const eur = total / REGLA.tasa;
  return { subtotal, total, eur, comision: total - subtotal };
}

function pintarCarrito() {
  const hay = Object.keys(carrito).length > 0;
  document.getElementById('btnCarrito').classList.toggle('oculto', !hay);
  if (!hay) { cerrarDrawer(); return; }
  const cont = document.getElementById('lineas');
  cont.innerHTML = '';
  for (const nombre in carrito) {
    const l = carrito[nombre];
    const div = document.createElement('div');
    div.className = 'linea';
    div.innerHTML = '<button>-</button><span class="q"></span><span class="nom"></span><span style="flex:1"></span><span class="imp"></span><button>+</button>';
    div.querySelector('.q').textContent = l.qty + '×';
    div.querySelector('.nom').textContent = nombre;
    div.querySelector('.imp').textContent = fmtINR(l.base * l.qty);
    div.querySelectorAll('button')[0].onclick = () => cambiar(nombre, -1);
    div.querySelectorAll('button')[1].onclick = () => cambiar(nombre, +1);
    cont.appendChild(div);
  }
  const c = calcular();
  const numArt = Object.values(carrito).reduce(function (s, l) { return s + l.qty; }, 0);
  document.getElementById('carritoResumen').textContent = numArt + ' · ' + fmtEUR(c.eur);
  document.getElementById('desglose').innerHTML =
    'Subtotal: ' + fmtINR(c.subtotal) + '<br>' +
    'Comisión (mín. ' + Math.round(REGLA.comisionPct*100) + '%): ' + fmtINR(c.comision) + '<br>' +
    'Total: ' + fmtINR(c.total);
  document.getElementById('total').textContent = '≈ ' + fmtEUR(c.eur) + ' (orientativo)';
  document.getElementById('enviar').disabled = false;
}

async function enviar() {
  const nombre = document.getElementById('nombre').value.trim();
  if (!nombre) { alert('Pon tu nombre o @usuario de Telegram primero.'); return; }
  const c = calcular();
  const lineas = [];
  for (const k in carrito) lineas.push(carrito[k].qty + '× ' + k);
  const totalTexto = fmtINR(c.total) + ' ≈ ' + fmtEUR(c.eur);

  // Plan de emergencia: formulario visible rellenado
  if (CONFIG.envioVisible) {
    const url = FORM_URL +
      '?usp=pp_url' +
      '&entry.' + CONFIG.entryNombre + '=' + enc(nombre) +
      '&entry.' + CONFIG.entryPedido + '=' + enc(lineas.join('\n')) +
      '&entry.' + CONFIG.entryTotal + '=' + enc(totalTexto);
    window.open(url, '_blank');
    return;
  }

  const btn = document.getElementById('enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando…';

  // Envío oculto directo al formulario
  const cuerpo =
    'entry.' + CONFIG.entryNombre + '=' + enc(nombre) +
    '&entry.' + CONFIG.entryPedido + '=' + enc(lineas.join('\n')) +
    '&entry.' + CONFIG.entryTotal + '=' + enc(totalTexto) +
    '&fvv=1&draftResponse=[]&pageHistory=0';
  try {
    await fetch(FORM_RESPONSE_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: cuerpo
    });
    document.getElementById('nombre').value = '';
    vaciar();
    mostrarToast('✅ Pedido enviado. Te confirmo el precio por Telegram');
    btn.disabled = false;
    btn.textContent = 'Enviar pedido 📤';
  } catch (e) {
    const url = FORM_URL +
      '?usp=pp_url' +
      '&entry.' + CONFIG.entryNombre + '=' + enc(nombre) +
      '&entry.' + CONFIG.entryPedido + '=' + enc(lineas.join('\n')) +
      '&entry.' + CONFIG.entryTotal + '=' + enc(totalTexto);
    window.open(url, '_blank');
    btn.disabled = false;
    btn.textContent = 'Enviar pedido 📤';
  }
}

cargar();
</script>
</body>
</html>
